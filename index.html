<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leuis Decor</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    h1, h2, h3, h4, h5 {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-white text-gray-800">
  <header class="flex justify-between items-center p-6 bg-white shadow-md sticky top-0 z-50">
    <div class="flex items-center space-x-4">
      <img src="logo.png" alt="Leuis Decor Logo" class="h-12 w-12 rounded-full" />
      <div class="text-2xl font-bold text-green-700">Leuis Decor</div>
    </div>
    <nav class="space-x-6 text-lg">
      <a href="#home" class="hover:text-green-700">Home</a>
      <a href="#about" class="hover:text-green-700">About</a>
      <a href="#services" class="hover:text-green-700">Services</a>
      <a href="#gallery" class="hover:text-green-700">Gallery</a>
      <a href="#testimonials" class="hover:text-green-700">Testimonials</a>
      <a href="#contact" class="hover:text-green-700">Contact</a>
      <a href="#quotation" class="bg-gradient-to-r from-emerald-600 to-green-400 text-white px-4 py-2 rounded-xl shadow-lg hover:scale-105 transition-all">Order Quotation</a>
    </nav>
  </header>

  <section id="gallery" class="py-12 px-4">
    <h2 class="text-3xl font-bold text-center text-green-700 mb-8">Our Work</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <img src="https://images.unsplash.com/photo-1602526211670-799bb8f2ee93?auto=format&fit=crop&w=800&q=80" alt="Gallery 1" class="rounded-lg shadow" />
      <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80" alt="Gallery 2" class="rounded-lg shadow" />
      <img src="https://images.unsplash.com/photo-1526045478516-99145907023c?auto=format&fit=crop&w=800&q=80" alt="Gallery 3" class="rounded-lg shadow" />
      <img src="https://images.unsplash.com/photo-1599140786600-0f50d1e2ec81?auto=format&fit=crop&w=800&q=80" alt="Gallery 4" class="rounded-lg shadow" />
      <img src="https://images.unsplash.com/photo-1601656131799-d090f2f3f54f?auto=format&fit=crop&w=800&q=80" alt="Gallery 5" class="rounded-lg shadow" />
      <img src="https://images.unsplash.com/photo-1529472119190-76a74e7e6d76?auto=format&fit=crop&w=800&q=80" alt="Gallery 6" class="rounded-lg shadow" />
    </div>
  </section>

  <footer class="text-center py-6 mt-10 border-t text-sm text-gray-500">
    &copy; 2025 Leuis Decor. All rights reserved. Email: <a href="mailto:jonniespikes30@gmail.com" class="text-green-600">jonniespikes30@gmail.com</a>
  </footer>
</body>
</html>
